<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Фізичний симулятор</title>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">Фізичний симулятор <span class="stage">етап 2</span></div>

      <label class="field">
        <span>Сцена</span>
        <select id="scene"></select>
      </label>
      <label class="field">
        <span>Інтегратор</span>
        <select id="integrator"></select>
      </label>

      <div class="buttons" role="group" aria-label="Керування часом">
        <button id="play" type="button" class="icon-button" aria-label="Пауза" title="Пауза (Пробіл)">
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" /></svg>
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" /></svg>
        </button>
        <button id="step" type="button" class="icon-button" aria-label="Один крок" title="Один крок (. або →)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5v11l7-5.5zM11 2.5h2.5v11H11z" /></svg>
        </button>
        <button id="reset" type="button" class="icon-button" aria-label="Скинути" title="Скинути (R)">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 8a5 5 0 1 1-1.5-3.55" />
            <path d="M12 1.5v3.2H8.8" />
          </svg>
        </button>
        <button id="fit" type="button" class="icon-button" aria-label="Показати все" title="Показати все (F)">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" />
          </svg>
        </button>
      </div>

      <label class="field slider">
        <span>Швидкість</span>
        <input id="time-scale" type="range" />
        <output id="time-scale-out"></output>
      </label>
      <label class="field slider">
        <span>Крок dt</span>
        <input id="dt" type="range" />
        <output id="dt-out"></output>
      </label>

      <fieldset class="toggles">
        <legend class="visually-hidden">Шари</legend>
        <label><input type="checkbox" id="layer-trails" checked /> Сліди</label>
        <label><input type="checkbox" id="layer-analytic" checked /> Точний розв’язок</label>
        <label><input type="checkbox" id="layer-velocities" /> Швидкості</label>
        <label><input type="checkbox" id="layer-contacts" /> Контакти</label>
      </fieldset>
    </header>

    <main class="layout">
      <section class="viewport" aria-label="Симуляція">
        <canvas id="sim"></canvas>
        <details id="hud" class="hud" open>
          <summary id="scene-title"></summary>
          <p id="scene-description"></p>
          <p id="integrator-summary" class="muted"></p>
        </details>
        <div id="status" class="badge" hidden></div>
        <div id="cursor" class="cursor"></div>
      </section>

      <aside id="stats" class="panel" aria-label="Показники"></aside>

      <section class="graph" aria-labelledby="graph-title">
        <div class="graph-head">
          <h2 id="graph-title"></h2>
          <div id="legend" class="legend"></div>
        </div>
        <div class="graph-body">
          <canvas id="graph"></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
